<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Live Dashboard</title>
  <style>
    :root {
      --bg-color: #0F172A;
      --card-open: #1E293B;
      --card-active: #1800AD;
      --card-expiring: #C2410C;
      --card-expired: #991B1B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-green: #22C55E;
      --accent-red: #EF4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
    }

    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #60A5FA; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      max-width: 800px;
      margin: 0 auto;
    }

    .table-card {
      background: var(--card-open);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s ease, background 0.3s ease;
      position: relative;
    }

    .table-card:active { transform: scale(0.96); }

    /* STATE CARD STYLES */
    .table-card.state-open { background: var(--card-open); border-color: #334155; opacity: 0.6; }
    .table-card.state-active { background: var(--card-active); border-color: #3B82F6; opacity: 1; }
    .table-card.state-expiring { background: var(--card-expiring); border-color: #F97316; opacity: 1; }
    .table-card.state-expired { background: var(--card-expired); border-color: #EF4444; opacity: 1; }

    .table-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .table-num { font-size: 1.4rem; font-weight: 800; }
    
    .bill-emoji {
      font-size: 1.2rem;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }
    .bill-faded { opacity: 0.3; filter: grayscale(100%); }
    .bill-approved { opacity: 1; filter: drop-shadow(0 0 4px #22C55E); }

    .status-badge { 
      font-size: 0.75rem; 
      text-transform: uppercase; 
      margin-top: 6px; 
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .timer-display { 
      font-size: 1.1rem; 
      margin-top: 8px; 
      color: #FACC15; 
      font-weight: bold; 
      font-family: monospace;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center; justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #1E293B;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .btn-action {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-pay { background: var(--accent-green); color: #000; }
    .btn-pay.approved { background: #334155; color: var(--text-muted); }
    .btn-close { background: #334155; color: #FFF; }

    .verify-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 6px;
    }
    .verified { background: var(--accent-green); color: #000; }
    .unverified { background: var(--accent-red); color: #FFF; }
  </style>
</head>
<body>

  <h1>📱 Counter Dashboard</h1>
  <div id="tableGrid" class="grid">Loading floor plan...</div>

  <!-- DETAILS MODAL -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">Table X</h2>
      <hr style="border-color: #334155;">
      
      <p><strong>Order Summary:</strong></p>
      <ul id="modalOrders" style="padding-left: 20px; color: var(--text-muted); font-size: 0.95rem;"></ul>

      <p><strong>Total Sum:</strong> $<span id="modalTotal">0.00</span></p>
      
      <p><strong>Focus Time Verification:</strong></p>
      <div id="modalVerify" class="verify-badge">Checking...</div>

      <button id="markPaidBtn" class="btn-action btn-pay" onclick="togglePaymentStatus()">Mark as Paid</button>
      <button class="btn-action btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0XdbmciOU4y0-RAC4YOQVvZfKpZrPJ-exxZ6lBQgy/exec";
    
    let activeData = {};
    let previousActiveTables = new Set();
    let currentSelectedTable = null;
    let wakeLock = null;

    // Wake Screen API
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock error:", err);
      }
    }

    // Audio Chime Player
    function playNewTableChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        function tone(freq, start, duration) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.5, ctx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration);
        }

        // Two-tone arrival chime
        tone(523.25, 0, 0.2); // C5
        tone(659.25, 0.25, 0.4); // E5
      } catch (e) {
        console.log("Audio play blocked", e);
      }
    }

    function parseEndTime(endTimeStr) {
      if (!endTimeStr) return null;
      const now = new Date();
      const match = endTimeStr.match(/(\d+):(\d+)(?::(\d+))?\s*(AM|PM)?/i);
      if (!match) return null;

      let hours = parseInt(match[1], 10);
      let minutes = parseInt(match[2], 10);
      let seconds = match[3] ? parseInt(match[3], 10) : 0;
      let ampm = match[4];

      if (ampm) {
        if (ampm.toUpperCase() === "PM" && hours < 12) hours += 12;
        if (ampm.toUpperCase() === "AM" && hours === 12) hours = 0;
      }

      const end = new Date(now);
      end.setHours(hours, minutes, seconds, 0);
      return end;
    }

    async function fetchDashboardData() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=manager`);
        const json = await res.json();
        
        if (json.status === "success") {
          const newData = json.tables;
          const currentActiveTables = new Set();

          // Retain local payment approval states across polling refreshes
          Object.keys(newData).forEach(tNum => {
            if (activeData[tNum] && activeData[tNum].isPaid !== undefined) {
              newData[tNum].isPaid = activeData[tNum].isPaid;
            } else {
              newData[tNum].isPaid = false;
            }

            const status = newData[tNum].status.toLowerCase();
            if (status === 'active' || status === 'expiring') {
              currentActiveTables.add(tNum);
            }
          });

          // Check for newly entered tables
          let newTableDetected = false;
          currentActiveTables.forEach(tNum => {
            if (!previousActiveTables.has(tNum)) {
              newTableDetected = true;
            }
          });

          if (newTableDetected) {
            playNewTableChime();
            requestWakeLock();
          }

          previousActiveTables = currentActiveTables;
          activeData = newData;
          renderGrid();
        }
      } catch (err) {
        console.error("Failed to load dashboard:", err);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = '';

      const sortedKeys = Object.keys(activeData).sort((a, b) => parseInt(a) - parseInt(b));

      sortedKeys.forEach(tNum => {
        const t = activeData[tNum];
        const statusLower = t.status.toLowerCase();

        const card = document.createElement('div');
        card.className = `table-card state-${statusLower}`;
        card.onclick = () => openModal(tNum);

        const isPaid = t.isPaid;
        const billClass = isPaid ? 'bill-approved' : 'bill-faded';
        const showBillEmoji = statusLower !== 'open';

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">Table ${t.table}</span>
            ${showBillEmoji ? `<span class="bill-emoji ${billClass}">💵</span>` : ''}
          </div>
          <div class="status-badge">${t.status.toUpperCase()}</div>
          <div class="timer-display" id="timer-${tNum}">--:--</div>
        `;

        grid.appendChild(card);
      });

      updateTimers();
    }

    function updateTimers() {
      const now = new Date();

      Object.keys(activeData).forEach(tNum => {
        const t = activeData[tNum];
        const timerEl = document.getElementById(`timer-${tNum}`);
        if (!timerEl) return;

        const statusLower = t.status.toLowerCase();

        if (statusLower === 'open') {
          timerEl.innerText = '--:--';
          return;
        }

        const endDate = parseEndTime(t.endTime);
        if (!endDate) {
          timerEl.innerText = '--:--';
          return;
        }

        const diffMs = endDate.getTime() - now.getTime();

        if (diffMs <= 0) {
          timerEl.innerText = '00:00';
          t.status = 'Expired';
          const card = timerEl.closest('.table-card');
          if (card) card.className = 'table-card state-expired';
        } else {
          const totalSecs = Math.floor(diffMs / 1000);
          const mins = Math.floor(totalSecs / 60);
          const secs = totalSecs % 60;
          timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
      });
    }

    function openModal(tNum) {
      currentSelectedTable = tNum;
      const t = activeData[tNum];
      if (!t) return;

      document.getElementById('modalTitle').innerText = `Table ${t.table} Details`;
      
      const ordersList = document.getElementById('modalOrders');
      ordersList.innerHTML = t.orders.length > 0 
        ? t.orders.map(item => `<li>${item}</li>`).join('')
        : '<li>No items recorded</li>';

      document.getElementById('modalTotal').innerText = t.totalSum.toFixed(2);

      const verifyEl = document.getElementById('modalVerify');
      if (t.intervalCount) {
        verifyEl.innerText = "✓ VERIFIED (Interval Active)";
        verifyEl.className = "verify-badge verified";
      } else {
        verifyEl.innerText = "✕ NOT VERIFIED";
        verifyEl.className = "verify-badge unverified";
      }

      updateModalPaidBtn();
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function updateModalPaidBtn() {
      const btn = document.getElementById('markPaidBtn');
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const isPaid = activeData[currentSelectedTable].isPaid;
      if (isPaid) {
        btn.innerText = "✓ Paid & Approved";
        btn.className = "btn-action btn-pay approved";
      } else {
        btn.innerText = "Mark as Paid";
        btn.className = "btn-action btn-pay";
      }
    }

    function togglePaymentStatus() {
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      activeData[currentSelectedTable].isPaid = !activeData[currentSelectedTable].isPaid;
      updateModalPaidBtn();
      renderGrid();
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
      currentSelectedTable = null;
    }

    // Initialize timers and data polling
    fetchDashboardData();
    setInterval(fetchDashboardData, 10000); // Poll Apps Script backend every 10s
    setInterval(updateTimers, 1000);        // Update countdown timers every 1s
  </script>
</body>
</html>
