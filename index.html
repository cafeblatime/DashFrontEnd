<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Live Dashboard - Connected Mode</title>
  <style>
    :root {
      --bg-color: #1800ad;
      --card-open: #FAF9F6;
      --card-active: #2E7D32;      /* Green */
      --card-expiring: #E65100;    /* Orange */
      --card-expired: #D32F2F;     /* Red */
      --text-main: #1800ad;
      --text-muted: #5A6B82;
      --accent-green: #2E7D32;
      --accent-red: #D32F2F;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
    }

    .dashboard-container {
      background: #FAF9F6;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 16px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 { 
      font-size: 1.25rem; 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 20px; 
      background: #1800ad;
      color: #FAF9F6; 
      padding: 12px;
      border-radius: 12px;
      letter-spacing: 0.5px; 
      text-transform: uppercase; 
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 380px;
      margin: 0 auto;
    }

    .table-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      border: 2px solid #E2E8F0;
      transition: transform 0.1s ease, background 0.3s ease;
      position: relative;
    }

    .table-card.clickable { cursor: pointer; }
    .table-card.clickable:active { transform: scale(0.96); }

    .table-card.state-open { background: #FFFFFF; border-color: #E2E8F0; opacity: 0.85; cursor: default; }
    .table-card.state-active { background: var(--card-active); border-color: #2E7D32; opacity: 1; color: #FFFFFF; }
    .table-card.state-expiring { background: var(--card-expiring); border-color: #E65100; opacity: 1; color: #FFFFFF; }
    .table-card.state-expired { background: var(--card-expired); border-color: #D32F2F; opacity: 1; color: #FFFFFF; }

    .table-card.state-active .table-num,
    .table-card.state-expiring .table-num,
    .table-card.state-expired .table-num { color: #FFFFFF; }

    .table-card.state-active .timer-display,
    .table-card.state-expiring .timer-display,
    .table-card.state-expired .timer-display { color: #FFEB3B; }

    .table-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .table-num { font-size: 1.1rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; }
    
    .bill-emoji {
      font-size: 1rem;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }
    .bill-faded { opacity: 0.3; filter: grayscale(100%); }
    .bill-approved { opacity: 1; filter: drop-shadow(0 0 4px #2E7D32); }
    
    .timer-display { 
      font-size: 0.95rem; 
      margin-top: 8px; 
      color: var(--text-muted); 
      font-weight: bold; 
      font-family: monospace;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center; justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #FAF9F6;
      color: #1800ad;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .btn-action {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-pay { background: #E2E8F0; color: var(--text-muted); }
    .btn-pay.approved { background: #2E7D32; color: #FFFFFF; }
    .btn-close { background: #E2E8F0; color: #1800ad; }

    .verify-badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .verified { background: #2E7D32; color: #FFFFFF; }
    .unverified { background: #D32F2F; color: #FFFFFF; }

    #pinOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pin-box {
      background: #FAF9F6;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .pin-input {
      font-size: 1.8rem;
      letter-spacing: 8px;
      text-align: center;
      width: 80%;
      padding: 10px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      color: #1800ad;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .pin-error {
      color: #D32F2F;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="pinOverlay">
    <div class="pin-box">
      <h2 style="margin-top:0; color:#1800ad; font-size: 1.2rem;">Manager Access</h2>
      <p style="color:var(--text-muted); font-size:0.9rem;">Enter 4-digit PIN code:</p>
      <input type="password" id="pinInput" maxlength="4" class="pin-input" pattern="\d*" inputmode="numeric">
      <div id="pinError" class="pin-error">Incorrect PIN. Try again.</div>
      <button class="btn-action btn-pay approved" onclick="verifyPin()" style="margin-top:8px;">Enter</button>
    </div>
  </div>

  <div class="dashboard-container">
    <h1>Counter Dashboard</h1>
    <div id="tableGrid" class="grid">Connecting...</div>
  </div>

  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">Table X</h2>
      <hr style="border-color: #E2E8F0;">
      
      <p><strong>Order Summary:</strong></p>
      <ul id="modalOrders" style="padding-left: 20px; color: var(--text-muted); font-size: 0.95rem;"></ul>

      <p><strong>Total Sum:</strong> $<span id="modalTotal">0.00</span></p>
      
      <div id="modalVerify" class="verify-badge">Checking...</div>

      <button id="markPaidBtn" class="btn-action btn-pay" onclick="togglePaymentStatus()">Mark as Paid</button>
      <button class="btn-action btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const MANAGER_PIN = "0070"; 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjQtbuew_onZqKqSEO49KeMQwIwm-t5VBwwSC1l8XcBE-7bWcjcnUDS4Jv9lNHgC2HbQ/exec"; 

    let activeData = {};
    let currentSelectedTable = null;
    let pollInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
      const pinInput = document.getElementById('pinInput');
      pinInput.focus();
      pinInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyPin();
      });
    });

    function verifyPin() {
      const enteredPin = document.getElementById('pinInput').value;
      const errorEl = document.getElementById('pinError');

      if (enteredPin === MANAGER_PIN) {
        document.getElementById('pinOverlay').style.display = 'none';
        fetchDashboardData(); 
        pollInterval = setInterval(fetchDashboardData, 10000); 
      } else {
        errorEl.style.display = 'block';
        document.getElementById('pinInput').value = '';
      }
    }

    async function fetchDashboardData() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=manager`);
        const result = await response.json();
        
        if (result.status === "success" && result.tables) {
          Object.keys(result.tables).forEach(tNum => {
            if (activeData[tNum] && activeData[tNum].isPaid !== undefined) {
              result.tables[tNum].isPaid = activeData[tNum].isPaid;
            } else {
              result.tables[tNum].isPaid = false; 
            }
            
            result.tables[tNum].secondsLeft = parseEndTimeToSeconds(result.tables[tNum].endTime);
          });

          activeData = result.tables;
          renderGrid();
          
          if (currentSelectedTable && activeData[currentSelectedTable]) {
            updateModalContent(currentSelectedTable);
          }
        }
      } catch (err) {
        console.error("Failed to fetch live data from Google Sheets:", err);
      }
    }

    function parseEndTimeToSeconds(rawEnd) {
      if (!rawEnd) return 0;
      const now = new Date();
      
      const timeStr = String(rawEnd).trim();
      const timeParts = timeStr.match(/(\d+):(\d+)(?::(\d+))?\s*(AM|PM)?/i);
      if (!timeParts) return 0;

      let hours = parseInt(timeParts[1], 10);
      let minutes = parseInt(timeParts[2], 10);
      let seconds = timeParts[3] ? parseInt(timeParts[3], 10) : 0;
      let ampm = timeParts[4];

      if (ampm) {
        if (ampm.toUpperCase() === "PM" && hours < 12) hours += 12;
        if (ampm.toUpperCase() === "AM" && hours === 12) hours = 0;
      }

      const endDate = new Date(now);
      endDate.setHours(hours, minutes, seconds, 0);

      const diffMs = endDate.getTime() - now.getTime();
      return Math.max(0, Math.floor(diffMs / 1000));
    }

    function renderGrid() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = '';

      const sortedKeys = Object.keys(activeData).sort((a, b) => parseInt(a) - parseInt(b));

      sortedKeys.forEach(tNum => {
        const t = activeData[tNum];
        const statusLower = t.status.toLowerCase();

        const card = document.createElement('div');
        const isOpen = statusLower === 'open';
        
        card.className = `table-card state-${statusLower}`;

        if (isOpen) {
          card.style.cursor = 'default';
          card.onclick = null;
        } else {
          card.className += ' clickable';
          card.onclick = () => openModal(tNum);
        }

        const isPaid = t.isPaid;
        const billClass = isPaid ? 'bill-approved' : 'bill-faded';
        const showBillEmoji = !isOpen;

        let timerText = "--:--";
        if (isOpen) {
          timerText = "Available";
        } else if (statusLower === 'expired') {
          timerText = "00:00";
        } else {
          const mins = Math.floor(t.secondsLeft / 60);
          const secs = t.secondsLeft % 60;
          timerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">Table ${t.table}</span>
            ${showBillEmoji ? `<span class="bill-emoji ${billClass}">💵</span>` : ''}
          </div>
          <div class="timer-display" id="timer-${tNum}">${timerText}</div>
        `;

        grid.appendChild(card);
      });
    }

    setInterval(() => {
      Object.keys(activeData).forEach(tNum => {
        const t = activeData[tNum];
        if (t.status.toLowerCase() === 'active' || t.status.toLowerCase() === 'expiring') {
          if (t.secondsLeft > 0) {
            t.secondsLeft--;
            if (t.secondsLeft <= 300 && t.status.toLowerCase() === 'active') {
              t.status = 'Expiring';
            }
          } else {
            t.status = 'Expired';
          }
          
          const timerEl = document.getElementById(`timer-${tNum}`);
          if (timerEl) {
            const mins = Math.floor(t.secondsLeft / 60);
            const secs = t.secondsLeft % 60;
            timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
          }
        }
      });
    }, 1000);

    function openModal(tNum) {
      currentSelectedTable = tNum;
      updateModalContent(tNum);
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function updateModalContent(tNum) {
      const t = activeData[tNum];
      if (!t) return;

      document.getElementById('modalTitle').innerText = `Table ${t.table} Details`;
      
      const ordersList = document.getElementById('modalOrders');
      ordersList.innerHTML = t.orders.length > 0 
        ? t.orders.map(item => `<li>${item}</li>`).join('')
        : '<li>No items recorded</li>';

      document.getElementById('modalTotal').innerText = t.totalSum.toFixed(2);

      const verifyEl = document.getElementById('modalVerify');
      if (t.status.toLowerCase() === 'open') {
        verifyEl.innerText = "Table is available";
        verifyEl.className = "verify-badge unverified";
      } else if (t.intervalCount) {
        verifyEl.innerText = "Focus pass is verified";
        verifyEl.className = "verify-badge verified";
      } else {
        verifyEl.innerText = "Focus pass not verified";
        verifyEl.className = "verify-badge unverified";
      }

      updateModalPaidBtn();
    }

    function updateModalPaidBtn() {
      const btn = document.getElementById('markPaidBtn');
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const t = activeData[currentSelectedTable];
      if (t.status.toLowerCase() === 'open') {
        btn.style.display = 'none';
        return;
      }
      btn.style.display = 'block';

      const isPaid = t.isPaid;
      if (isPaid) {
        btn.innerText = "✓ Paid & Approved";
        btn.className = "btn-action btn-pay approved";
      } else {
        btn.innerText = "Mark as Paid";
        btn.className = "btn-action btn-pay";
      }
    }

    async function togglePaymentStatus() {
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const t = activeData[currentSelectedTable];
      t.isPaid = !t.isPaid;
      updateModalPaidBtn();
      renderGrid();

      // Only trigger a clear action when explicitly marking as paid / clearing the table
      if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT") && t.isPaid) {
        try {
          await fetch(`${APPS_SCRIPT_URL}?table=${currentSelectedTable}&action=clear`);
        } catch (err) {
          console.error("Failed to sync payment status with sheet:", err);
        }
      }
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
      currentSelectedTable = null;
    }
  </script>
</body>
</html>
